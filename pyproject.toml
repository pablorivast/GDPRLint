[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdprlint"
dynamic = ["version"]
description = "Technical privacy and security guardrail for coding agents via Git pre-commit hooks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "GDPRLint contributors" }]
keywords = ["security", "privacy", "gdpr", "secrets", "pii", "git", "pre-commit", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "laya>=0.3.7",
]

[project.urls]
Homepage = "https://github.com/pablorivast/GDPRLint"
Repository = "https://github.com/pablorivast/GDPRLint"
Changelog = "https://github.com/pablorivast/GDPRLint/blob/main/CHANGELOG.md"
Issues = "https://github.com/pablorivast/GDPRLint/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
gdprlint = "gdprlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "gdprlint.__version__" }

[tool.setuptools.package-data]
gdprlint = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = [
    "--cov=gdprlint",
    "--cov-report=term-missing",
    "--cov-fail-under=78",
]
markers = [
    "laya_e2e: tests that load real Laya weights (slow, needs network first time)",
]

[tool.coverage.run]
source = ["gdprlint"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # pyupgrade
    "B",     # bugbear
    "BLE",   # blind-except
    "C4",    # comprehensions
    "SIM",   # simplify
    "PIE",   # misc lints
    "PLW",   # pylint warnings
    "RUF",   # ruff-specific
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
disallow_untyped_defs = true
